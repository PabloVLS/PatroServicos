spring.application.name=PatroServicos
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5432/patroservicos
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# PostgreSQL specific configuration to handle TEXT fields properly
spring.jpa.properties.hibernate.jdbc.batch_size=10
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Disable LOB stream handling for TEXT columns
spring.jpa.properties.hibernate.use_nationalized_character_data=false