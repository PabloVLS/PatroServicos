<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profissionais - PatroServiços</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/profissionais.css">

</head>

<body>
    <!-- navbar substituído pelo fragment -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- Área de Busca -->
    <section class="busca-destaque">
        <div class="container">
            <div class="container-busca">
                <h1 class="text-center mb-4">Encontre o profissional perfeito</h1>

                <div class="caixa-busca d-flex">
                    <input id="campoBusca" type="text" class="campo-busca flex-grow-1"
                        placeholder="Busque por serviço, nome ou especialidade">
                    <button id="botaoBusca" class="botao-busca">Buscar</button>
                </div>

                <!-- <div class="filtros">
                    <div class="filtro ativo" data-tipo="todos">Todos</div>
                    <div class="filtro" data-tipo="categoria" data-valor="Encanador">Encanadores</div>
                    <div class="filtro" data-tipo="categoria" data-valor="Eletricista">Eletricistas</div>
                    <div class="filtro" data-tipo="categoria" data-valor="Diarista">Diaristas</div>
                    <div class="filtro" data-tipo="categoria" data-valor="Pedreiro">Pedreiros</div>
                    <div class="filtro" data-tipo="categoria" data-valor="Pintor">Pintores</div>
                </div> -->
                <div class="filtros-avancados card p-4">
                    <div class="row">
                        <div class="col-md-3">
                            <label class="form-label fw-bold">Avaliação Mínima</label>
                            <select id="filtroAvaliacao" class="form-select">
                                <option value="">Qualquer avaliação</option>
                                <option value="1">1+ estrelas</option>
                                <option value="2">2+ estrelas</option>
                                <option value="3">3+ estrelas</option>
                                <option value="4">4+ estrelas</option>
                                <option value="5">5 estrelas</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-bold">Cidade</label>
                            <input type="text" id="filtroCidade" class="form-control" placeholder="Digite a cidade">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-bold">Ordenar Por</label>
                            <select id="filtroOrdenacao" class="form-select">
                                <option value="">Padrão</option>
                                <option value="rating">Melhor Avaliados</option>
                                <option value="newest">Mais Recentes</option>
                                <option value="verificado">Profissionais Verificados</option>
                            </select>
                        </div>

                        <div class="col-md-3 d-flex align-items-end">
                            <button id="botaoAplicarFiltros" class="btn btn-primary w-100">Aplicar Filtros</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Seção de Filtros Avançados -->
    <section class="container mb-5">

    </section>

    <!-- Lista de Profissionais -->
    <section class="container mb-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="contador-profissionais">Mostrando <strong>12</strong> de <strong>86</strong> profissionais</div>

            <div class="opcoes-visualizacao">
                <button class="botao-visualizacao ativo" id="visualizacaoGrade">
                    <i class="fas fa-th"></i>
                </button>
                <button class="botao-visualizacao" id="visualizacaoLista">
                    <i class="fas fa-list"></i>
                </button>
            </div>
        </div>

        <div class="row" id="gradeProfissionais">
            <!-- Profissionais carregados dinamicamente -->
        </div>

        <div class="carregando" id="indicadorCarregamento">
            <div class="spinner-carregamento"></div>
        </div>
    </section>

    <!-- footer substituído pelo fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Carregar profissionais do servidor ao iniciar a página
        document.addEventListener('DOMContentLoaded', function () {
            carregarProfissionaisDoBanco();

            // Ligação do botão de busca e tecla Enter
            const botaoBusca = document.getElementById('botaoBusca');
            const campoBusca = document.getElementById('campoBusca');

            if (botaoBusca) {
                botaoBusca.addEventListener('click', function () {
                    carregarProfissionaisDoBanco();
                });
            }

            if (campoBusca) {
                campoBusca.addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        carregarProfissionaisDoBanco();
                    }
                });
            }

            // Botão Aplicar Filtros
            const botaoAplicarFiltros = document.getElementById('botaoAplicarFiltros');
            if (botaoAplicarFiltros) {
                botaoAplicarFiltros.addEventListener('click', aplicarFiltros);
            }

            // Filtros por categoria rápida (Todos, Encanadores, etc)
            document.querySelectorAll('.filtro').forEach(filtro => {
                filtro.addEventListener('click', function () {
                    document.querySelectorAll('.filtro').forEach(f => f.classList.remove('ativo'));
                    this.classList.add('ativo');

                    // Se for "todos", carregar tudo
                    if (this.dataset.tipo === 'todos') {
                        carregarProfissionaisDoBanco();
                    } else if (this.dataset.tipo === 'categoria') {
                        // Aplicar filtro por categoria
                        carregarProfissionaisComFiltros({
                            categoria: this.dataset.valor,
                            cidade: '',
                            minRating: '',
                            nome: '',
                            sortBy: ''
                        });
                    }
                });
            });
        });

        // Função para aplicar filtros avançados
        function aplicarFiltros() {
            const filtros = {
                categoria: '',
                cidade: document.getElementById('filtroCidade').value,
                minRating: document.getElementById('filtroAvaliacao').value,
                nome: document.getElementById('campoBusca').value,
                sortBy: document.getElementById('filtroOrdenacao').value
            };

            carregarProfissionaisComFiltros(filtros);
        }

        // Buscar profissionais com filtros
        function carregarProfissionaisComFiltros(filtros) {
            let url = '/api/profissionais/filtrados?';

            if (filtros.categoria && filtros.categoria.trim()) {
                url += `categoria=${encodeURIComponent(filtros.categoria)}&`;
            }
            if (filtros.cidade && filtros.cidade.trim()) {
                url += `cidade=${encodeURIComponent(filtros.cidade)}&`;
            }
            if (filtros.minRating && filtros.minRating.trim()) {
                url += `minRating=${encodeURIComponent(filtros.minRating)}&`;
            }
            if (filtros.nome && filtros.nome.trim()) {
                url += `nome=${encodeURIComponent(filtros.nome)}&`;
            }
            if (filtros.sortBy && filtros.sortBy.trim()) {
                url += `sortBy=${encodeURIComponent(filtros.sortBy)}&`;
            }

            // Remove a última & se existir
            url = url.replace(/&$/, '');

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.sucesso && data.profissionais && data.profissionais.length > 0) {
                        renderizarProfissionais(data.profissionais);
                        atualizarContador(data.total);
                        carregarFotosPerfis(data.profissionais);
                    } else {
                        document.getElementById('gradeProfissionais').innerHTML = '<div class="col-12 text-center py-4">Nenhum profissional encontrado com os filtros selecionados.</div>';
                        atualizarContador(0);
                    }
                })
                .catch(error => console.error('Erro ao carregar profissionais:', error));
        }

        // Buscar profissionais aprovados da API
        function carregarProfissionaisDoBanco() {
            const campo = document.getElementById('campoBusca');
            const query = campo ? campo.value.trim() : '';
            const url = query ? `/api/profissionais?q=${encodeURIComponent(query)}` : '/api/profissionais';

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.sucesso && data.profissionais && data.profissionais.length > 0) {
                        renderizarProfissionais(data.profissionais);
                        atualizarContador(data.total);
                        carregarFotosPerfis(data.profissionais);
                    } else {
                        // limpar e mostrar mensagem quando não houver resultados
                        document.getElementById('gradeProfissionais').innerHTML = '<div class="col-12 text-center py-4">Nenhum profissional encontrado.</div>';
                        atualizarContador(0);
                    }
                })
                .catch(error => console.error('Erro ao carregar profissionais:', error));
        }

        // Renderizar cards dos profissionais
        function renderizarProfissionais(profissionais) {
            const container = document.getElementById('gradeProfissionais');

            // Limpar todos os cards existentes
            container.innerHTML = '';

            profissionais.forEach(profissional => {
                const cardHtml = criarCardProfissional(profissional);
                container.insertAdjacentHTML('beforeend', cardHtml);

                // Carregar avaliações após criar o card
                carregarAvaliacoesProfissional(profissional.userId);
            });
        }

        // Criar HTML do card do profissional
        function criarCardProfissional(profissional) {
            const sloVerificado = profissional.verificado ? '<div class="selo-verificado" title="Profissional verificado"><i class="fas fa-check" style="color: white;"></i></div>' : '<div class="selo-verificado" style="display: none;"></div>';
            
            return `
                <div class="col-md-6 col-lg-4">
                    <div class="card-profissional">
                        <div class="container-imagem">
                            <img src="/img/profissionais/default-avatar.jpg" alt="${profissional.nomeUsuario || 'Profissional'}" class="imagem-card" id="img-${profissional.userId}">
                            ${sloVerificado}
                        </div>
                        <div class="conteudo-card">
                            <h3 class="nome-profissional">${profissional.nomeUsuario || 'Profissional'}</h3>
                            <span class="categoria-profissional">${profissional.areaAtuacao || 'Serviço'}</span>

                            <div class="avaliacao" id="avaliacao-${profissional.userId}">
                                <!-- Avaliações carregadas dinamicamente -->
                            </div>

                            <div class="info-profissional">
                                <i class="fas fa-map-marker-alt"></i>
                                <span id="cidade-${profissional.userId}">${profissional.cidade || 'Localização não informada'}</span>
                            </div>

                            <div class="info-profissional">
                                <i class="fas fa-briefcase"></i>
                                <span>${profissional.experiencia || 'Experiência não informada'}</span>
                            </div>

                            <div class="acoes-card">
                                <button class="botao-secundario btn" onclick="irParaPerfil(${profissional.userId})">Ver perfil</button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Ir para o perfil do profissional
        function irParaPerfil(userId) {
            console.log('Navegando para perfil do usuário:', userId);
            window.location.href = '/profissional/' + userId;
        }

        // Carregar a primeira foto do portfólio para cada profissional
        function carregarFotosPerfis(profissionais) {
            profissionais.forEach(prof => {
                // Carregar foto de perfil do usuário
                fetch(`/api/usuario/${prof.userId}/foto`)
                    .then(response => response.json())
                    .then(data => {
                        if (data.sucesso && data.fotoUrl) {
                            // Usar foto de perfil
                            const imgElement = document.getElementById(`img-${prof.userId}`);
                            if (imgElement) {
                                imgElement.src = data.fotoUrl;
                            }
                        }
                    })
                    .catch(error => console.error('Erro ao carregar foto de perfil:', error));
            });
        }

        // Carregar avaliações e média de um profissional
        function carregarAvaliacoesProfissional(userId) {
            fetch(`/api/profissional/${userId}/avaliacoes`)
                .then(response => response.json())
                .then(data => {
                    if (data.sucesso) {
                        console.log(`Avaliações para ${userId}:`, data);
                        renderizarAvaliacoes(userId, data.mediaAvaliacao, data.totalAvaliacoes);
                    } else {
                        console.warn('Erro ao carregar avaliações:', data);
                    }
                })
                .catch(error => console.error('Erro ao carregar avaliações:', error));
        }

        // Renderizar as estrelas e quantidade de avaliações
        function renderizarAvaliacoes(userId, mediaAvaliacao, totalAvaliacoes) {
            const container = document.getElementById(`avaliacao-${userId}`);
            if (!container) {
                console.warn(`Container não encontrado para userId: ${userId}`);
                return;
            }

            // Limpar conteúdo anterior
            container.innerHTML = '';

            // Converter para número se vier como string
            const media = parseFloat(mediaAvaliacao) || 0;
            const total = parseInt(totalAvaliacoes) || 0;

            // Renderizar estrelas cheias e vazias
            const notaInteira = Math.floor(media);
            const temMeia = media % 1 >= 0.5;

            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('i');

                if (i <= notaInteira) {
                    // Estrela cheia
                    star.className = 'fas fa-star';
                    star.style.color = '#ffc107';
                } else if (i === notaInteira + 1 && temMeia) {
                    // Meia estrela
                    star.className = 'fas fa-star-half-alt';
                    star.style.color = '#ffc107';
                } else {
                    // Estrela vazia
                    star.className = 'far fa-star';
                    star.style.color = '#ffc107';
                }

                container.appendChild(star);
            }

            // Adicionar espaço entre estrelas e contador
            const espaco = document.createElement('span');
            espaco.textContent = ' ';
            container.appendChild(espaco);

            // Adicionar contador de avaliações
            const contador = document.createElement('span');
            contador.className = 'contador-avaliacoes';
            contador.textContent = `(${total} ${total === 1 ? 'avaliação' : 'avaliações'})`;
            container.appendChild(contador);

            console.log(`Avaliações renderizadas para ${userId}: ${media} estrelas, ${total} avaliações`);
        }

        // Atualizar contador de profissionais
        function atualizarContador(total) {
            const contador = document.querySelector('.contador-profissionais');
            if (contador) {
                contador.innerHTML = `Mostrando <strong>${Math.min(total, 12)}</strong> de <strong>${total}</strong> profissionais`;
            }
        }

        // Alternar entre visualização em grid e lista
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('visualizacaoGrade').addEventListener('click', function () {
                document.getElementById('visualizacaoGrade').classList.add('ativo');
                document.getElementById('visualizacaoLista').classList.remove('ativo');
                document.getElementById('gradeProfissionais').classList.remove('visualizacao-lista');
            });

            document.getElementById('visualizacaoLista').addEventListener('click', function () {
                document.getElementById('visualizacaoLista').classList.add('ativo');
                document.getElementById('visualizacaoGrade').classList.remove('ativo');
                document.getElementById('gradeProfissionais').classList.add('visualizacao-lista');
            });
        });

        // (A busca agora é feita por `carregarProfissionaisDoBanco`, que já carrega fotos)
    </script>
</body>

</html>
