<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - PatroServicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/cadastro.css">
</head>
<body>
    <div class="fundo">
        <div class="container">
            <div class="heading">
                <a href="/" class="logo navbar-brand">Patro<span>Serviços</span></a>
            </div>
            <div id="messages">
                <!-- mensagens de sucesso/erro serão mostradas aqui -->
            </div>
            <p class="subheading">Crie sua conta e comece a usar nossos serviços</p>

            <form class="form" action="/cadastro" method="post">
                <div class="form-row">
                    <input placeholder="Nome completo" id="fullName" name="fullName" type="text" class="input" required />
                </div>

                <input placeholder="Email" id="email" name="email" type="email" class="input" required />
                <input placeholder="Senha" id="password" name="password" type="password" class="input" required />
                <input placeholder="Confirmar senha" id="confirmPassword" name="confirmPassword" type="password"
                    class="input" required />

                <div class="terms">
                    <input type="checkbox" id="terms" name="terms" required />
                    <label for="terms">Concordo com os <a href="/termos">Termos de Serviço</a> e <a
                            href="/privacidade">Política de Privacidade</a></label>
                </div>

                <input value="Criar Conta" type="submit" class="register-button" />
            </form>

            <div class="login-container">
                <span class="text">Já tem uma conta? <a href="/login"><b>Fazer login</b></a></span>
            </div>
        </div>
    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
