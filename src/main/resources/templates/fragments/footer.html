    <!-- Toast container e funções globais (incluídas no fragmento) -->
    <style>
        /* Toasts customizados (global) */
        #toastContainer {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1080;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            pointer-events: none;
        }

        .app-toast {
            min-width: 260px;
            max-width: 380px;
            background: white;
            border-radius: 12px;
            padding: 0.75rem 0.9rem;
            box-shadow: 0 8px 20px rgba(2,6,23,0.12);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transform: translateY(-8px) scale(0.98);
            opacity: 0;
            transition: all 220ms ease;
            pointer-events: auto;
            border-left: 4px solid transparent;
            overflow: hidden;
        }

        .app-toast.show { transform: translateY(0) scale(1); opacity: 1; }
        .app-toast .app-toast-icon { width: 40px; height: 40px; border-radius: 8px; display:flex; align-items:center; justify-content:center; color:white; font-size:0.95rem; flex:0 0 40px; }
        .app-toast .app-toast-content { flex:1 1 auto; color:#0f172a; font-size:0.95rem; }
        .app-toast .app-toast-close { background: transparent; border: none; color: #6b7280; font-size: 1rem; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
        .app-toast.success { border-left-color: #10b981; }
        .app-toast.error { border-left-color: #ef4444; }
        .app-toast.info { border-left-color: #3b82f6; }
        .app-toast.success .app-toast-icon { background: linear-gradient(135deg,#10b981,#34d399); }
        .app-toast.error .app-toast-icon { background: linear-gradient(135deg,#ef4444,#f87171); }
        .app-toast.info .app-toast-icon { background: linear-gradient(135deg,#3b82f6,#60a5fa); }
    </style>

    <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <script>
        function showToast(message, type = 'info', timeout = 4000) {
            try {
                let container = document.getElementById('toastContainer');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'toastContainer';
                    document.body.appendChild(container);
                }

                const toast = document.createElement('div');
                toast.className = `app-toast ${type}`;

                const icon = document.createElement('div');
                icon.className = 'app-toast-icon';
                icon.innerHTML = type === 'success' ? '<i class="fas fa-check"></i>' : type === 'error' ? '<i class="fas fa-exclamation-triangle"></i>' : '<i class="fas fa-info"></i>';

                const content = document.createElement('div');
                content.className = 'app-toast-content';
                content.textContent = message;

                const btn = document.createElement('button');
                btn.className = 'app-toast-close';
                btn.innerHTML = '&times;';
                btn.addEventListener('click', () => removeToast(toast));

                toast.appendChild(icon);
                toast.appendChild(content);
                toast.appendChild(btn);
                container.appendChild(toast);

                setTimeout(() => toast.classList.add('show'), 20);

                const removeToast = (el) => {
                    el.classList.remove('show');
                    setTimeout(() => { try { el.remove(); } catch (e) {} }, 220);
                };

                setTimeout(() => removeToast(toast), timeout);
            } catch (e) {
                console.error('showToast error', e);
            }
        }
    </script>
